name: Build and release patcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and run all verification
        shell: pwsh
        run: ./tests/Test-All.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: patcher-${{ github.sha }}
          path: |
            dist/PCL-Download-Patcher.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            artifacts/verification.json
            artifacts/launcher-test/result.json
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ github.run_id }}
          path: |
            artifacts/*.log
            artifacts/launcher-test/*.log
            artifacts/tests-*/result-*.xml

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'chocoQAQ/PCL-Download-Patcher'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patcher-${{ github.sha }}
          path: artifacts
      - name: Publish the verified standalone EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="patcher-${COMMIT:0:12}"
          supported="$(jq -r '.supported_version' artifacts/dist/build-info.json)"
          checks="$(jq -r '.patcher_checks' artifacts/artifacts/verification.json)"
          {
            printf '%s\n\n' "第三方 PCL 下载检查和定向修复工具，支持下载方法匹配的 ${supported} 构建（包括其他部分有改动的文件）。已启用下载入口的旧版本显示无需修复；这项静态检查不代表联网下载已验证。需要 Windows 和 .NET Framework 4.8。"
            printf '%s\n\n' '运行 EXE 并选择已有的 PCL。修复前自动保存完整备份和校验记录，保留其他方法及内嵌资源，支持还原原文件。Release 直接提供单个 EXE。'
            printf '%s\n\n' "此构建已通过 ${checks} 项备份还原及兼容性检查、其他方法与资源保留检查、补丁方法运行时编译，以及使用官方修复样本实际下载 Mojang 客户端并校验 SHA-1。"
            printf '%s\n\n' '原作 Plain Craft Launcher：龙腾猫跃。源码：https://github.com/Meloong-Git/PCL · 赞助：https://meloong.com/afd/a/LTCat'
            printf '源码提交：`%s`\n\n' "$COMMIT"
            printf '%s\n\n' '工具 SHA-256：'
            printf '```text\n'
            cat artifacts/dist/SHA256SUMS.txt
            printf '```\n'
          } > release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$COMMIT" --draft \
              --title "PCL 下载修复工具 ${COMMIT:0:12}" --notes-file release-notes.md
          fi
          gh release upload "$tag" artifacts/dist/PCL-Download-Patcher.exe --clobber
          gh release edit "$tag" --draft=false --latest --notes-file release-notes.md
